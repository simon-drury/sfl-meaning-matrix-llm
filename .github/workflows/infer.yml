name: Test LASSM Interactive Inference

on:
  workflow_dispatch:
    inputs:
      prompt:
        description: 'Input text prompt to feed into LASSM'
        required: true
        default: 'Could you please explain what happened? Thank you.'

permissions:
  contents: read

jobs:
  infer:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install torch numpy

      - name: Run Interactive Inference
        run: |
          python interact.py "${{ github.event.inputs.prompt }}"
