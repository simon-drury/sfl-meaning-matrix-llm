name: Train and Generate 3x3 LASSM

on:
  workflow_dispatch:
    inputs:
      epochs:
        description: 'Number of training epochs'
        required: false
        default: '10'
      learning_rate:
        description: 'Learning rate (AdamW)'
        required: false
        default: '0.0001'

jobs:
  train:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy torch

      - name: Step 1 - Ingest Treebank Data
        run: |
          python download_and_ingest_treebank.py

      - name: Step 2 - Execute Supervised Training & Generation Debugger
        run: |
          python traincore.py --epochs ${{ github.event.inputs.epochs }} --lr ${{ github.event.inputs.learning_rate }}

      - name: Step 3 - Commit Artifacts, Trajectories, and Checkpoint
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add data/ sfl_model_3x3.pt
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore(ci): update empirical trajectories, vocabulary centroids, and model checkpoint" && git push)
