name: train SFL model

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  train:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install torch numpy

      - name: Run genuine training on empirical data
        run: |
          python traincore.py --data_path data/empirical_trajectories.jsonl --output_path sfl_model_3x3.pt --epochs 25

      - name: Commit and push trained model weights
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git add sfl_model_3x3.pt
          if git diff --staged --quiet; then
            echo "No changes in model weights."
          else
            git commit -m "Auto-update trained sfl_model_3x3.pt from empirical training workflow"
            git push origin main
          fi
